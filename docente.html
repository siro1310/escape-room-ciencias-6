<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel docente</title>
<style>
body{margin:0;background:#f4f1ea;color:#1d2733;font-family:Georgia,"Times New Roman",serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.c{background:#fff;border:1px solid #d9d3c5;border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.7rem}button{padding:11px 20px;border:0;border-radius:10px;background:#1f4e8c;color:#fff;font:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:8px 10px;border-bottom:1px solid #d9d3c5;text-align:left}th{color:#5d6b7a;font-weight:normal;font-size:.82rem;text-transform:uppercase}.tb{overflow:auto}.mu{color:#5d6b7a}.pill{padding:2px 9px;border-radius:99px;border:1px solid #d9d3c5}.f{border-color:#2e7d4f;color:#2e7d4f}
</style>
</head>
<body>
<div class="w">
<div class="c">
<h1>📡 Panel en vivo</h1>
<p class="mu">Este panel muestra los registros almacenados en Supabase.</p>
<button onclick="location.href='index.html'">🔐 Volver al Escape Room</button>
</div>
<div class="c">
<p id="st" class="mu">Conectando…</p>
<div class="tb"><table>
<thead><tr><th>Estudiante</th><th>Grado</th><th>Ingreso</th><th>Última actividad</th><th>Cerradura</th><th>Aciertos</th><th>Nota final</th></tr></thead>
<tbody id="b"></tbody>
</table></div>
</div>
</div>
<script>
const U="https://lwvahgozwszbmfmfdlvr.supabase.co";
const K="sb_publishable_QxjDQHOQfPzcfDIuss2IMQ_eJphb_lr";
const hm=x=>x?new Date(x).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
async function load(){
 try{
  const r=await fetch(U+"/rest/v1/sesiones?select=*&order=inicio.asc",{headers:{apikey:K,Authorization:"Bearer "+K}});
  if(!r.ok)throw new Error(await r.text());
  const rows=await r.json(), b=document.getElementById("b"); b.innerHTML="";
  if(!rows.length){const tr=b.insertRow(),td=tr.insertCell();td.colSpan=7;td.textContent="Aún no hay estudiantes.";return}
  rows.forEach(x=>{
   const tr=b.insertRow();
   [x.nombre||"—",x.grado||"—",hm(x.inicio),hm(x.terminado?x.fin:x.actividad),x.terminado?"Completado":(x.cerradura||1)+" de 5",(x.aciertos??0)+" / 5",x.terminado?(x.nota??"—"):"En curso"].forEach((v,i)=>{
    const td=tr.insertCell();
    if(i===6){const s=document.createElement("span");s.className="pill"+(x.terminado?" f":"");s.textContent=v;td.appendChild(s)}else td.textContent=v;
   });
  });
  document.getElementById("st").textContent="Actualizado "+new Date().toLocaleTimeString("es-CO");
 }catch(e){document.getElementById("st").textContent="Error al leer Supabase: "+e.message}
}
load();setInterval(load,3000);
</script>
</body>
</html>
