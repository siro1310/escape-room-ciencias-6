<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel docente · Escape Room</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d2733;--mu:#5d6b7a;--ac:#1f4e8c;--ok:#2e7d4f;--bad:#b3392f;--bd:#d9d3c5;--hi:#e8eef8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.55}.w{max-width:900px;margin:0 auto;padding:16px}nav{display:flex;gap:8px;margin-bottom:16px}nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.2rem;margin:0 0 .4em}.mu{color:var(--mu);font-size:.92rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.authbox{max-width:460px;margin:30px auto}.authbox input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.b{display:inline-block;padding:11px 18px;border:1px solid var(--ac);border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}.b.g{background:transparent;color:var(--ac)}.b.danger{background:#9b2c2c;border-color:#9b2c2c}.b:disabled{opacity:.5;cursor:wait}.hide{display:none}.msg{margin-top:12px;padding:10px 12px;border-radius:9px}.msg.bad{background:#f9e7e5;border:1px solid var(--bad);color:#7b201b}.msg.ok{background:#e7f4eb;border:1px solid var(--ok);color:#225c39}.tb{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px;font-size:.92rem}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:normal;font-size:.8rem;text-transform:uppercase}.pill{padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.pill.ok{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>
<div class="w">
<nav><button class="on" type="button">📡 Panel docente</button><button id="goStudent" type="button">🔐 Escape Room</button></nav>
<section id="login" class="c authbox">
<h2>🔐 Acceso docente</h2><p class="mu">Esta página es exclusiva para el docente.</p>
<label for="email">Correo</label><input id="email" type="email" autocomplete="username" placeholder="correo del docente">
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
<button class="b" id="loginBtn" type="button">Entrar al panel</button>
<div id="authMsg" class="msg hide"></div>
</section>
<section id="panel" class="c hide">
<div class="row"><h1>Panel en vivo</h1><span class="mu">🕒 <span id="clock"></span></span></div>
<div class="row" style="margin:10px 0"><div><h2 id="groupTitle">Grupo 1</h2><div class="mu" id="sessionInfo">Sesión activa</div><div class="mu" id="sessionId"></div></div><div class="row">
<button class="b g" id="saveBtn" type="button">💾 Guardar resultados</button><button class="b" id="newBtn" type="button">🔄 Nuevo grupo</button><button class="b danger" id="resetBtn" type="button">🗑️ Limpiar trabajo</button><button class="b g" id="logoutBtn" type="button">Salir</button>
</div></div>
<div id="status" class="msg ok">Conectando…</div>
<div class="tb"><table><thead><tr><th>Estudiante</th><th>Ingreso</th><th>Última actividad</th><th>Cerradura</th><th>Aciertos</th><th>Nota final</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</div>
<script>
(function(){
'use strict';
const URL='https://lwvahgozwszbmfmfdlvr.supabase.co';
const KEY='sb_publishable_QxjDQHOQfPzcfDIuss2IMQ_eJphb_lr';
const API=URL+'/rest/v1/sesiones';
const AUTH=URL+'/auth/v1';
const QLEN=5;
let token=localStorage.getItem('docente_access_token')||'';
let refresh=localStorage.getItem('docente_refresh_token')||'';
let active={grupo:1,id:'',creada:null};
let timer=null;
const $=id=>document.getElementById(id);
const hm=v=>v?new Date(v).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMsg(id,text,kind){const e=$(id);e.textContent=text;e.className='msg '+(kind||'');e.classList.remove('hide')}
function clearMsg(id){$(id).className='msg hide';$(id).textContent=''}
async function api(path,opts={}){
 const headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opts.headers||{});
 if(token) headers.Authorization='Bearer '+token;
 let r=await fetch(URL+path,Object.assign({},opts,{headers}));
 if(r.status===401 && refresh){
   const rr=await fetch(AUTH+'/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});
   if(rr.ok){const s=await rr.json();token=s.access_token;refresh=s.refresh_token||refresh;localStorage.setItem('docente_access_token',token);localStorage.setItem('docente_refresh_token',refresh);headers.Authorization='Bearer '+token;r=await fetch(URL+path,Object.assign({},opts,{headers}))}
 }
 const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}
 if(!r.ok){const m=(data&&data.message)||(data&&data.error_description)||(data&&data.hint)||text||('HTTP '+r.status);throw new Error(m)}
 return data;
}
async function login(){
 clearMsg('authMsg');$('loginBtn').disabled=true;
 try{
   const email=$('email').value.trim(),password=$('password').value;
   if(!email||!password)throw new Error('Escribe correo y contraseña.');
   const r=await fetch(AUTH+'/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
   const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){d=t}
   if(!r.ok)throw new Error((d&&d.error_description)||(d&&d.msg)||(d&&d.message)||t||('HTTP '+r.status));
   token=d.access_token;refresh=d.refresh_token||'';localStorage.setItem('docente_access_token',token);localStorage.setItem('docente_refresh_token',refresh);
   await start();
 }catch(e){setMsg('authMsg','No se pudo iniciar sesión: '+e.message,'bad')}finally{$('loginBtn').disabled=false}
}
async function control(){
 const rows=await api('/?select=grupo,session_id,inicio&tipo=eq.control&id=eq.__control__&limit=1');
 if(!rows.length||!rows[0].session_id)throw new Error('No existe una sesión activa en __control__.');
 active={grupo:Number(rows[0].grupo)||1,id:rows[0].session_id,creada:rows[0].inicio};
 $('groupTitle').textContent='Grupo '+active.grupo;$('sessionInfo').textContent='Sesión activa · '+hm(active.creada);$('sessionId').textContent='ID de sesión · '+active.id;
}
async function load(){
 try{
  await control();
  const rows=await api('/?select=id,nombre,inicio,actividad,cerradura,aciertos,terminado,fin,nota,session_id,grupo,tipo&tipo=eq.estudiante&session_id=eq.'+encodeURIComponent(active.id)+'&order=inicio.asc');
  render(rows);setMsg('status','Panel actualizado · '+rows.length+' estudiante(s).','ok');
 }catch(e){setMsg('status','Error: '+e.message,'bad');console.error(e)}
}
function render(rows){
 const b=$('rows');b.innerHTML='';
 if(!rows.length){const tr=b.insertRow(),td=tr.insertCell();td.colSpan=6;td.textContent='Aún no hay estudiantes en la sesión actual.';td.className='mu';return}
 rows.forEach(r=>{const tr=b.insertRow();const vals=[r.nombre||'—',hm(r.inicio),hm(r.terminado?r.fin:r.actividad),r.terminado?'Completado':((r.cerradura||1)+' de '+QLEN),(r.aciertos??0)+' / '+QLEN,r.terminado?String(r.nota??''): 'En curso'];vals.forEach((v,i)=>{const td=tr.insertCell();if(i===5){const s=document.createElement('span');s.className='pill '+(r.terminado?'ok':'');s.textContent=v;td.appendChild(s)}else td.textContent=v})});
}
function csv(){
 const trs=[...$('rows').querySelectorAll('tr')];let out='sep=,\nEstudiante,Ingreso,Última actividad,Cerradura,Aciertos,Nota final\n';
 trs.forEach(tr=>{const cells=[...tr.cells].map(td=>'"'+td.innerText.replaceAll('"','""')+'"');if(cells.length===6)out+=cells.join(',')+'\n'});
 const blob=new Blob([out],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resultados-grupo-'+active.grupo+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function newGroup(){
 if(!confirm('¿Guardar resultados y abrir el siguiente grupo? Los datos anteriores se conservarán.'))return;
 csv();const g=active.grupo+1;const id='g'+g+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const now=new Date().toISOString();
 try{await api('/?id=eq.__control__',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({tipo:'control',nombre:'__CONTROL__',inicio:now,actividad:now,cerradura:0,aciertos:0,terminado:false,fin:null,nota:null,session_id:id,grupo:g})});await load()}catch(e){alert('No se pudo crear el grupo: '+e.message)}
}
async function reset(){
 if(!confirm('Esto borrará todos los resultados de estudiantes. ¿Continuar?'))return;if(!confirm('Última confirmación: se perderán los resultados no descargados.'))return;
 try{await api('/?tipo=eq.estudiante',{method:'DELETE',headers:{Prefer:'return=minimal'}});const now=new Date().toISOString(),id='g1-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await api('/?id=eq.__control__',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({tipo:'control',nombre:'__CONTROL__',inicio:now,actividad:now,cerradura:0,aciertos:0,terminado:false,fin:null,nota:null,session_id:id,grupo:1})});await load();alert('Trabajo limpiado. Grupo 1 iniciado con una sesión nueva.')}catch(e){alert('No se pudo limpiar: '+e.message)}
}
async function start(){
 if(!token){$('login').classList.remove('hide');$('panel').classList.add('hide');return}
 $('login').classList.add('hide');$('panel').classList.remove('hide');await load();if(timer)clearInterval(timer);timer=setInterval(load,3000);
}
$('loginBtn').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('saveBtn').addEventListener('click',csv);$('newBtn').addEventListener('click',newGroup);$('resetBtn').addEventListener('click',reset);$('logoutBtn').addEventListener('click',()=>{localStorage.removeItem('docente_access_token');localStorage.removeItem('docente_refresh_token');token='';refresh='';if(timer)clearInterval(timer);location.reload()});$('goStudent').addEventListener('click',()=>location.href='/');setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('es-CO')},1000);start();
})();
</script>
</body></html>
