<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel docente · Escape Room</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d2733;--mu:#5d6b7a;--ac:#1f4e8c;--ok:#2e7d4f;--bad:#b3392f;--bd:#d9d3c5;--hi:#e8eef8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181f;--card:#1b242e;--tx:#e8edf2;--mu:#9aa8b6;--ac:#6fa3e6;--ok:#5cc189;--bad:#ef7d72;--bd:#2f3b48;--hi:#22303f}}
:root[data-theme="dark"]{--bg:#12181f;--card:#1b242e;--tx:#e8edf2;--mu:#9aa8b6;--ac:#6fa3e6;--ok:#5cc189;--bad:#ef7d72;--bd:#2f3b48;--hi:#22303f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
.w{max-width:760px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.2rem;margin:0 0 .4em}
.mu{color:var(--mu);font-size:.92rem}
.big{font-size:3.4rem;line-height:1;margin:0}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:10px 0}
.b{display:inline-block;padding:11px 20px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.b:disabled{opacity:.45;cursor:default}
.b.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.b.danger{background:#9b2c2c;color:#fff;border:1px solid #9b2c2c}
.locks{display:flex;gap:8px;margin-bottom:14px}
.lk{flex:1;text-align:center;padding:8px 2px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:1.25rem}
.lk.cur{border-color:var(--ac);background:var(--hi)}
.lk.done{border-color:var(--ok)}
.ctx{background:var(--hi);border-left:4px solid var(--ac);padding:12px 14px;border-radius:8px;margin:10px 0}
.op{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--ac)}
.op.sel{border-color:var(--ac);background:var(--hi)}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.op.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.msg{padding:12px 14px;border-radius:10px;margin:10px 0}
.msg.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border:1px solid var(--ok)}
.msg.no{background:color-mix(in srgb,var(--bad) 15%,transparent);border:1px solid var(--bad)}
.hint{background:color-mix(in srgb,#e0a800 18%,transparent);border:1px dashed #b98a00;padding:10px 14px;border-radius:10px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mu);font-weight:normal;font-size:.82rem;text-transform:uppercase}
.pill{padding:2px 9px;border-radius:99px;font-size:.8rem;border:1px solid var(--bd)}
.pill.f{border-color:var(--ok);color:var(--ok)}
.hide{display:none}
.nota{font-size:3rem;color:var(--ac);margin:.1em 0}
.authbox{max-width:460px;margin:30px auto}.authbox input{width:100%;padding:12px;margin:7px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.authmsg{margin-top:10px}.teacherOnly{display:none}
</style>
</head>
<body>
<div class="w">
<nav><button class="on">📡 Panel docente</button><button id="goStudent">🔐 Escape Room</button></nav>
<section id="login" class="c authbox">
<h2>🔐 Acceso docente</h2><p class="mu">Esta página es exclusiva para el docente.</p>
<label>Correo</label><input id="email" type="email" autocomplete="username" placeholder="correo del docente">
<label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
<button class="b" id="loginBtn">Entrar al panel</button><p class="mu authmsg" id="authMsg"></p>
</section>
<section id="panel" class="c hide">
<div class="row"><h1>Panel en vivo</h1><span class="mu">🕒 <span id="clock"></span></span></div>
<div class="row" style="margin:10px 0">
<div><h2 id="groupTitle">Grupo 1</h2><div class="mu" id="sessionInfo">Sesión activa</div><div class="mu" id="sessionId"></div></div>
<div class="row">
<button class="b g" id="saveBtn">💾 Guardar resultados</button>
<button class="b" id="newBtn">🔄 Nuevo grupo</button>
<button class="b danger" id="resetBtn">🗑️ Limpiar trabajo</button>
<button class="b g" id="logoutBtn">Salir</button>
</div></div>
<p class="mu" id="status">Conectando…</p>
<div class="tb"><table><thead><tr><th>Estudiante</th><th>Ingreso</th><th>Última actividad</th><th>Cerradura</th><th>Aciertos</th><th>Nota final</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</div>
<script>
const SUPABASE_URL="https://lwvahgozwszbmfmfdlvr.supabase.co";
const SUPABASE_KEY="sb_publishable_QxjDQHOQfPzcfDIuss2IMQ_eJphb_lr";
const QLEN=5; let accessToken=localStorage.getItem("docente_access_token")||""; let active={grupo:1,id:"",creada:null}; let poll=null; let rowsCache=[];
const $=id=>document.getElementById(id);
function status(t,ok=false){$("status").textContent=t;$("status").style.color=ok?"var(--ok)":""}
function authmsg(t,ok=false){$("authMsg").textContent=t;$("authMsg").style.color=ok?"var(--ok)":"var(--bad)"}
function hm(v){return v?new Date(v).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—"}
function sessionUI(){$("groupTitle").textContent="Grupo "+active.grupo;$('sessionInfo').textContent="Sesión activa · "+hm(active.creada);$('sessionId').textContent="ID de sesión · "+active.id}
async function api(path,opt={}){const headers=Object.assign({apikey:SUPABASE_KEY,Accept:"application/json"},opt.headers||{});if(accessToken)headers.Authorization="Bearer "+accessToken;if(opt.body!==undefined)headers["Content-Type"]="application/json";const r=await fetch(SUPABASE_URL+path,{...opt,headers});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error((data?.message||data?.msg||data?.error_description||text||r.statusText)+" [HTTP "+r.status+"]");return data}
async function login(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){authmsg("Escribe correo y contraseña.");return}$("loginBtn").disabled=true;authmsg("Conectando…",true);try{const d=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});if(!d?.access_token)throw new Error("Supabase no devolvió token de acceso");accessToken=d.access_token;localStorage.setItem("docente_access_token",accessToken);await start()}catch(e){localStorage.removeItem("docente_access_token");accessToken="";authmsg("No se pudo iniciar sesión: "+e.message)}finally{$("loginBtn").disabled=false}}
async function readControl(){const d=await api("/rest/v1/sesiones?select=grupo%2Csession_id%2Cinicio&id=eq.__control__&tipo=eq.control&limit=1");if(!d?.length||!d[0].session_id)throw new Error("No existe una sesión activa en __control__");active={grupo:Number(d[0].grupo)||1,id:d[0].session_id,creada:d[0].inicio};sessionUI()}
async function load(){try{await readControl();const d=await api("/rest/v1/sesiones?select=id%2Cnombre%2Cinicio%2Cactividad%2Ccerradura%2Caciertos%2Cterminado%2Cfin%2Cnota%2Csession_id%2Cgrupo%2Ctipo&tipo=eq.estudiante&session_id=eq."+encodeURIComponent(active.id)+"&order=inicio.asc");rowsCache=d||[];render(rowsCache);status("Panel actualizado · "+rowsCache.length+" estudiante(s).",true);$("diag").classList.remove("hide");$("diag").textContent="REST OK · sesión: "+active.id}catch(e){console.error(e);status("Error al leer: "+e.message);$("diag").classList.remove("hide");$("diag").textContent=e.message}}
function render(rows){const b=$("rows");b.innerHTML="";if(!rows.length){const tr=b.insertRow(),td=tr.insertCell();td.colSpan=6;td.className="mu";td.textContent="Aún no hay estudiantes en la sesión actual.";return}rows.forEach(r=>{const tr=b.insertRow();[r.nombre||"—",hm(r.inicio),hm(r.terminado?r.fin:r.actividad),r.terminado?"Completado":((r.cerradura||1)+" de "+QLEN),(r.aciertos??0)+" / "+QLEN,r.terminado?String(r.nota??""):"En curso"].forEach((v,i)=>{const td=tr.insertCell();if(i===5){const sp=document.createElement("span");sp.className="pill"+(r.terminado?" f":"");sp.textContent=v;td.appendChild(sp)}else td.textContent=v})})}
function csv(){const head=["Grupo","Sesión","Estudiante","Ingreso","Última actividad","Cerradura","Aciertos","Nota final"];const lines=[head,...rowsCache.map(r=>[active.grupo,active.id,r.nombre,hm(r.inicio),hm(r.terminado?r.fin:r.actividad),r.terminado?"Completado":(r.cerradura||1)+" de "+QLEN,r.aciertos??0,r.terminado?(r.nota??""):"En curso")].map(a=>a.map(x=>'"'+String(x??"").replaceAll('"','""')+'"').join(","))];const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="resultados-grupo-"+active.grupo+".csv";a.click();URL.revokeObjectURL(a.href);status("Resultados descargados en CSV.",true)}
function makeSession(g){return{grupo:g,id:"g"+g+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),creada:new Date().toISOString()}}
async function controlWrite(ns){await api("/rest/v1/sesiones?id=eq.__control__",{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({tipo:"control",nombre:"__CONTROL__",grupo:ns.grupo,inicio:ns.creada,actividad:ns.creada,cerradura:0,aciertos:0,terminado:false,fin:null,nota:null,session_id:ns.id})})}
async function newGroup(){if(!confirm("¿Guardar resultados y abrir el siguiente grupo? Los datos anteriores se conservarán."))return;csv();try{const ns=makeSession(active.grupo+1);await controlWrite(ns);active=ns;sessionUI();await load()}catch(e){alert("No se pudo crear el grupo: "+e.message)}}
async function reset(){if(!confirm("Esto borrará todos los resultados de estudiantes. ¿Continuar?"))return;if(!confirm("Última confirmación: se perderán los resultados no descargados."))return;try{await api("/rest/v1/sesiones?tipo=eq.estudiante",{method:"DELETE",headers:{Prefer:"return=minimal"}});const ns=makeSession(1);await controlWrite(ns);active=ns;sessionUI();await load();alert("Trabajo limpiado. Grupo 1 iniciado con una sesión nueva.")}catch(e){alert("No se pudo limpiar: "+e.message)}}
async function logout(){localStorage.removeItem("docente_access_token");accessToken="";if(poll)clearInterval(poll);location.reload()}
async function start(){try{if(!accessToken){$("login").classList.remove("hide");$("panel").classList.add("hide");return}await readControl();$("login").classList.add("hide");$("panel").classList.remove("hide");await load();if(poll)clearInterval(poll);poll=setInterval(load,3000)}catch(e){localStorage.removeItem("docente_access_token");accessToken="";$("login").classList.remove("hide");$("panel").classList.add("hide");authmsg("La sesión docente no es válida: "+e.message)}}
$("loginBtn").addEventListener("click",login);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("saveBtn").addEventListener("click",csv);$("newBtn").addEventListener("click",newGroup);$("resetBtn").addEventListener("click",reset);$("logoutBtn").addEventListener("click",logout);$("goStudent").addEventListener("click",()=>location.href="/");setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString("es-CO"),1000);start();
</script></body></html>
